name: publish-gateway-image

# STOPGAP pending codefly-dev/core#770 (the composite publisher in core 0.18.2).
# GHCR judges the workflow's defining repository: core's reusable workflow was
# denied "installation not allowed to Write organization package" when pushing
# a service package. Keep this job and its GITHUB_TOKEN in the service repo until
# the shared composite action can run inside it. The first dispatch is 0.0.2.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Upcoming stable agent version (without v; first release 0.0.2)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the commit to be on the default branch, or refuse
        id: default-branch
        run: |
          set -euo pipefail
          # This repository is public. Remote reads need no token; registry
          # login below is the only consumer of the job's GITHUB_TOKEN.
          authority=$(git ls-remote --symref origin HEAD \
            | awk '$1 == "ref:" && $3 == "HEAD" { sub("refs/heads/", "", $2); print $2 }')
          if [ -z "$authority" ]; then
            echo "::error::cannot read this repository's default branch from origin; refusing to publish." >&2
            exit 1
          fi
          git fetch --quiet --no-tags --force origin \
            "+refs/heads/${authority}:refs/remotes/origin/${authority}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/${authority}"; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not reachable from refs/remotes/origin/${authority}; refusing to publish." >&2
            exit 1
          fi

      - name: Validate the version and derive the image name
        id: inputs
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must be a stable semantic version without a v prefix" >&2
            exit 1
          fi
          image=$(printf 'ghcr.io/%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          {
            echo "image=$image"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      # The gateway uses cgo; cross-platform compilation needs an emulator for
      # the non-native build stage rather than just a GOARCH override.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.version=${{ steps.inputs.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ steps.inputs.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Record the digest lock
        id: lock
        env:
          IMAGE: ${{ steps.inputs.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "build returned no valid lowercase sha256 image-index digest" >&2
            exit 1
          fi
          mkdir -p release-evidence
          jq -n --arg name "$IMAGE" --arg digest "$DIGEST" '{name: $name, digest: $digest}' > release-evidence/gateway-image.json
          {
            echo 'Commit the artifact as gateway-image.json in a reviewed PR before publishing the agent:'
            echo
            echo '```json'
            cat release-evidence/gateway-image.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gateway-image-lock-${{ steps.inputs.outputs.version }}
          path: release-evidence/gateway-image.json
          if-no-files-found: error
