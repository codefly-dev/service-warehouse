name: publish-gateway-image

# Core builds by digest before the release tag; commit the returned lock before
# tagging. Its publisher refuses commits outside the default branch's history
# and checks out with persist-credentials: false.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Upcoming stable agent version (without v)
        required: true
        type: string

jobs:
  publish:
    permissions:
      contents: read
      packages: write
    uses: codefly-dev/core/.github/workflows/publish-service-image.yml@ea49e7a968ef5f2fd325b1c41f823a47eb20141c # v0.18.1
    with:
      version: ${{ inputs.version }}
      lock-file: gateway-image.json
      platforms: linux/amd64,linux/arm64
    secrets:
      registry-token: ${{ secrets.GITHUB_TOKEN }}
