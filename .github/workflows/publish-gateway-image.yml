name: publish-gateway-image

# Pushes the gateway image by digest and prints the lock the agent and the
# release pin. The publishing steps are core's shared composite action; only the
# job policy is this repository's. The job itself cannot move to core: GHCR
# authorizes the repository that defines the job, and a core-defined job was
# denied "installation not allowed to Write organization package" when writing a
# service package. So the event gate, the permissions, the timeout and the
# checkout stay here, and the action runs as a step inside them.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Upcoming stable agent version (without v; first release 0.0.2)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      lock: ${{ steps.publish.outputs.lock }}
    steps:
      # Full history and the triggering commit, with no `ref`: the action proves
      # that commit is reachable from the remote's own default branch, and a
      # shallow clone or a caller-selected ref would decide that question for it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The gateway uses cgo, so the linux/arm64 stage runs an arm64 toolchain
      # rather than cross-compiling, and needs binfmt. The action sets up buildx
      # but installs no emulator, so the caller supplies one. It is the only step
      # before the action, it runs no code from this repository and writes
      # nothing into the checkout, so the action's guard — a dirty tree, stored
      # Git credentials, an unmerged commit — still runs before login and build.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: codefly-dev/core/.github/actions/publish-service-image@5b9dbf5d7f03dd048d7b741dc8b79ab2bc407ab3 # v0.19.4
        id: publish
        with:
          version: ${{ inputs.version }}
          # Both stated rather than defaulted. The platforms are what
          # internal/gatewayimage says the SBOM evidence covers, and
          # TestShippedPlatformsMatchTheReleasePipeline reads this input to hold
          # the two together; the lock file is the name main.go embeds and the
          # release reads. Inheriting either default would let a new core pin
          # change what this repository ships without a commit here.
          platforms: linux/amd64,linux/arm64
          lock-file: gateway-image.json
          registry-token: ${{ secrets.GITHUB_TOKEN }}
