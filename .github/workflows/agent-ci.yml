# Full-lifecycle agent validation: `codefly agent ci` runs the source, release,
# and generated-service conformance gates against this agent, through the shared
# reusable workflow every codefly service agent uses.
#
# Manual (workflow_dispatch) until a run of it has been seen green on this
# repository. service-object-storage parks the same workflow because the CLI's
# pinned go source-packager predated Go 1.27, and the release/build stage failed
# with `go.mod requires go >= 1.27.0 (GOTOOLCHAIN=local)`
# (codefly-dev/cli#499, since closed). Run locally with a CLI whose packager
# still carries Go 1.26.4, `codefly agent ci` passes its manifest and source
# stages here and fails that same build stage; the CLI release named below has
# not been run against this repository. Switch the trigger to `pull_request` once the first
# dispatch passes.
name: agent-ci

on:
  workflow_dispatch:

jobs:
  agent-ci:
    # Pinned to an immutable core commit SHA, not @main (see release.yml): core's
    # v0.16.0, the release go.mod requires. Bump the two together.
    uses: codefly-dev/core/.github/workflows/agent-ci.yml@e54bc852f3d40cd1aeafc0ced2369a8c13a51bb8
    with:
      # The CLI release the gate runs with. The go source-packager it installs
      # is the one the CLI pins, so bumping this is how that pin moves.
      codefly-cli-version: "0.1.181"
